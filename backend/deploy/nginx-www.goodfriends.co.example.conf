# nginx 서버블록 — www.goodfriends.co (오라클 서버 129.159.47.244).
# TLS는 nginx-api.goodfriends.co.example.conf와 같은 Cloudflare Origin CA 인증서
# (goodfriends.co.pem/.key, 와일드카드라 api/www 공용) — 그 파일의 3~5단계를 먼저 끝낼 것.
#
# Reafy의 www.reafy.com과 다른 점: 거기엔 AOP 성공 또는 디버그 IP가 아니면 403을 주는
# debug_block이 있는데, 그건 Reafy가 아직 공개 전이라 걸어둔 것. goodfriends는 M5
# 소프트 론치로 실사용자를 받아야 하므로 그 블록은 일부러 뺐다 — 누구나 접속 가능.
#
# ⚠️ 캐노니컬은 www 서브도메인이다 — bare apex(goodfriends.co)로 APP_BASE_URL을 잡으면
#   안 됨. session.ts의 cookieDomainAttr()가 호스트명 라벨 2개 이하(apex)면 쿠키에
#   Domain 속성을 안 붙여 host-only 쿠키가 되고, api.goodfriends.co와 쿠키가 공유 안 돼
#   로그인이 깨진다(Reafy가 2026-09-09에 실제로 겪은 사고). apex 방문자를 www로
#   301 리다이렉트하는 서버블록은 지금은 생략 — 필요해지면 추가.
#
# 설치:
#   sudo cp nginx-www.goodfriends.co.example.conf /etc/nginx/sites-available/www.goodfriends.co
#   sudo ln -s /etc/nginx/sites-available/www.goodfriends.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name www.goodfriends.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.goodfriends.co;

    ssl_certificate /etc/nginx/ssl/origin-ca/goodfriends.co.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-ca/goodfriends.co.key;
    ssl_client_certificate /etc/nginx/ssl/cloudflare_origin_pull_ca.pem;
    ssl_verify_client optional;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
