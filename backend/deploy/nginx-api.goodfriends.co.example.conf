# nginx 서버블록 — api.goodfriends.co (오라클 서버 129.159.47.244).
# TLS는 certbot/Let's Encrypt 대신 Cloudflare Origin CA 인증서를 쓴다 — Reafy의
# grafana.reafy.com이 이미 이 패턴(와일드카드 Origin CA + ssl_client_certificate optional)
# 이라 그대로 따름. api.reafy.com/www.reafy.com은 아직 certbot이지만 이번 신규 도메인은
# Origin CA로 시작.
#
# 전제(이 파일 설치 전에 반드시 끝나 있어야 함):
#   1) Cloudflare에 goodfriends.co 존 추가, 네임서버 이전 완료
#   2) api.goodfriends.co / www.goodfriends.co A 레코드 → 129.159.47.244, 프록시(주황 구름) ON
#      (OCI VCN Security List가 Cloudflare IP 15개 CIDR에만 80/443을 열어주므로,
#      프록시가 꺼져 있으면 이 서버에 아예 도달 못 한다 — Reafy 때 실측된 제약)
#   3) Cloudflare 대시보드 → SSL/TLS → Origin Server → Create Certificate
#        - Private key type: RSA (2048)
#        - Hostnames: *.goodfriends.co, goodfriends.co  (와일드카드 하나로 api/www 둘 다 커버,
#          grafana.reafy.com과 동일 방식)
#        - Certificate Validity: 15 years
#      → 생성 시 보여주는 Origin Certificate(PEM)와 Private Key(PEM)를 그 자리에서 복사해둘 것
#        (Private Key는 그때 한 번만 보여줌, 다시 못 봄)
#   4) 서버에 배치(grafana와 같은 디렉터리, 파일명만 도메인으로):
#        sudo mkdir -p /etc/nginx/ssl/origin-ca   # 이미 있으면 무시
#        sudo vi /etc/nginx/ssl/origin-ca/goodfriends.co.pem   # Origin Certificate 붙여넣기
#        sudo vi /etc/nginx/ssl/origin-ca/goodfriends.co.key   # Private Key 붙여넣기
#        sudo chown root:root /etc/nginx/ssl/origin-ca/goodfriends.co.*
#        sudo chmod 644 /etc/nginx/ssl/origin-ca/goodfriends.co.pem
#        sudo chmod 600 /etc/nginx/ssl/origin-ca/goodfriends.co.key
#   5) Cloudflare 대시보드 → SSL/TLS → Overview → 암호화 모드 Full (Strict)
#
# 설치:
#   sudo cp nginx-api.goodfriends.co.example.conf /etc/nginx/sites-available/api.goodfriends.co
#   sudo ln -s /etc/nginx/sites-available/api.goodfriends.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# cloudflare_origin_pull_ca.pem(AOP용 CA)·cloudflare-realip.conf·websocket-map.conf는
# 이미 서버에 있고 전역 include라 새로 만들 필요 없음 — Reafy와 공유.

server {
    listen 80;
    server_name api.goodfriends.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.goodfriends.co;

    ssl_certificate /etc/nginx/ssl/origin-ca/goodfriends.co.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-ca/goodfriends.co.key;
    ssl_client_certificate /etc/nginx/ssl/cloudflare_origin_pull_ca.pem;
    ssl_verify_client optional;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header X-SSL-Client-Verify $ssl_client_verify always;
    }
}
