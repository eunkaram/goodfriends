# nginx 서버블록 — bare apex goodfriends.co → www.goodfriends.co 301 리다이렉트.
#
# 실전 발견(2026-10-26) — api/www 서버블록만 만들고 apex는 빠뜨렸더니, apex로
# 들어온 요청이 이 nginx의 default_server(인증서 없음/불일치)로 떨어져
# Cloudflare가 Full(Strict) 모드에서 origin 인증서 검증 실패 → 방문자에게
# 526 에러로 보임. TLS 종단에서 SNI로 서버블록을 고르기 때문에, 리다이렉트만
# 하는 블록이라도 apex용 server_name + 인증서가 반드시 있어야 한다.
#
# 인증서는 api/www와 같은 Cloudflare Origin CA 파일 재사용(와일드카드+apex
# SAN이라 이미 goodfriends.co도 커버함) — 새로 발급할 필요 없음.
#
# 설치:
#   sudo cp nginx-apex.goodfriends.co.example.conf /etc/nginx/sites-available/goodfriends.co
#   sudo ln -s /etc/nginx/sites-available/goodfriends.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name goodfriends.co;
    return 301 https://www.goodfriends.co$request_uri;
}

server {
    listen 443 ssl;
    server_name goodfriends.co;

    ssl_certificate /etc/nginx/ssl/origin-ca/goodfriends.co.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-ca/goodfriends.co.key;
    ssl_client_certificate /etc/nginx/ssl/cloudflare_origin_pull_ca.pem;
    ssl_verify_client optional;

    return 301 https://www.goodfriends.co$request_uri;
}
