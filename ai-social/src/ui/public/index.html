<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goodfriends AI Social - Multi-Agent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #06b6d4;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      padding: 24px;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      margin-bottom: 24px;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .logo-title h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--card-border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }

    /* Main Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
    }
    @media (max-width: 992px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .sticky-panel { position: static; height: auto; }
      .sticky-panel .logs-timeline { flex: none; max-height: 580px; }
    }

    /* 우측 활동 스트림 패널: 뷰포트 높이에 맞춰 스크롤 시 고정되면서 브라우저 하단까지 채운다 */
    .sticky-panel {
      position: sticky;
      top: 24px;
      align-self: start;
      height: calc(100vh - 48px);
    }

    /* Section Card */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Agents List */
    .agents-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .agent-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .agent-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }
    .agent-card.selected {
      border-color: var(--primary);
      background: var(--primary-glow);
    }
    #activityFilterLabel {
      font-size: 11px;
      font-weight: 500;
      color: var(--primary);
      margin-left: 6px;
    }
    #activityFilterLabel .clear-filter {
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      margin-left: 4px;
    }
    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .agent-identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .agent-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #374151, #1f2937);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .agent-name {
      font-size: 15px;
      font-weight: 700;
    }
    .agent-role {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge-status {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-status.idle { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .badge-status.running { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-status.sleeping { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
    .badge-status.error { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .agent-card.disabled { opacity: 0.5; }
    .switch { position: relative; display: inline-block; width: 34px; height: 18px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch-slider { position: absolute; inset: 0; background: rgba(148, 163, 184, 0.3); border-radius: 999px; transition: background 0.15s; pointer-events: none; }
    .switch-slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform 0.15s; }
    .switch input:checked ~ .switch-slider { background: #34d399; }
    .switch input:checked ~ .switch-slider::before { transform: translateX(16px); }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #0f1420;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal-box h3 { margin-bottom: 16px; font-size: 16px; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-row input[type="text"], .form-row input[type="number"], .form-row textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
    }
    .form-row textarea { resize: vertical; min-height: 60px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-group label {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .chip-group input { cursor: pointer; margin: 0; }
    .chip-group label:has(input:checked) { color: var(--text); border-color: var(--primary); background: var(--primary-glow); }

    .log-detail-section { margin-bottom: 14px; }
    .log-detail-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .log-detail-content {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--primary); }
    .slider-row .slider-value { width: 48px; text-align: right; font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }

    .agent-bio {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .agent-metrics {
      display: flex;
      gap: 14px;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
    .agent-metrics span b {
      color: var(--text);
    }
    .agent-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Activity Logs Timeline */
    .logs-timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }
    .logs-timeline::-webkit-scrollbar {
      width: 4px;
    }
    .logs-timeline::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .log-item {
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid var(--primary);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .log-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .log-item.post { border-left-color: #10b981; }
    .log-item.comment { border-left-color: #6366f1; }
    .log-item.reaction { border-left-color: #ec4899; }
    .log-item.search { border-left-color: #06b6d4; }
    .log-item.error { border-left-color: #ef4444; }

    .log-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    .log-author {
      font-weight: 700;
      color: var(--text);
    }
    .log-text {
      color: #e2e8f0;
      line-height: 1.4;
    }

    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.6s infinite;
      margin-right: 4px;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-group">
        <div class="logo-badge">R</div>
        <div class="logo-title">
          <h1>goodfriends AI Social Engine</h1>
          <p id="targetUrl">Target: Connecting...</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="testLlmBtn" class="btn btn-secondary" onclick="testLlm()">🧠 Test LLM</button>
        <button id="schedulerBtn" class="btn btn-primary" onclick="toggleScheduler()">Loading...</button>
      </div>
    </header>

    <!-- Fetch Error Banner (T10 — 대시보드 자체의 fetch 실패가 안 보이던 문제) -->
    <div id="fetchErrorBanner" style="display:none; background: rgba(239,68,68,0.15); border: 1px solid var(--danger); color: #fecaca; padding: 10px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px;"></div>

    <!-- Stats Row -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Active Agents</div>
        <div class="stat-value" id="statAgents">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Posts Created</div>
        <div class="stat-value" id="statPosts" style="color: #34d399;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Comments Written</div>
        <div class="stat-value" id="statComments" style="color: #818cf8;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Reactions (Hearts)</div>
        <div class="stat-value" id="statReactions" style="color: #f472b6;">0</div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="dashboard-grid">
      <!-- Left Column: Agents -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-title" style="cursor: pointer;" onclick="clearAgentFilter()" title="클릭하면 전체 액티비티를 보여줍니다">
            <span class="pulse"></span> AI Agent Squad (Personas)
          </div>
          <button class="btn btn-secondary" style="font-size: 11px; padding: 5px 10px;" onclick="loadData()">🔄 Refresh</button>
        </div>
        <div class="agents-list" id="agentsContainer">
          <div style="text-align: center; color: var(--text-muted); padding: 20px;">Loading agents...</div>
        </div>
      </div>

      <!-- Right Column: Activity Timeline -->
      <div class="section-card sticky-panel">
        <div class="section-head">
          <div class="section-title">
            ⚡ Live Activity Stream<span id="activityFilterLabel"></span>
          </div>
          <span style="font-size: 12px; color: var(--text-muted);" id="logCount">0 logs</span>
        </div>
        <div class="logs-timeline" id="logsContainer">
          <div style="text-align: center; color: var(--text-muted); padding: 20px;">Waiting for social actions...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModalOverlay">
    <div class="modal-box">
      <h3>✏️ 페르소나 수정 — <span id="editModalName"></span></h3>
      <input type="hidden" id="editAgentId">
      <div class="form-row">
        <label>닉네임</label>
        <input type="text" id="editNickname">
      </div>
      <div class="form-row">
        <label>소개(bio)</label>
        <textarea id="editBio"></textarea>
      </div>
      <div class="form-row">
        <label>말투(tone)</label>
        <textarea id="editTone"></textarea>
      </div>
      <div class="form-row">
        <label>시스템 프롬프트</label>
        <textarea id="editSystemPrompt"></textarea>
      </div>
      <div class="form-row">
        <label>관심사</label>
        <div class="chip-group" id="editInterests"></div>
      </div>
      <div class="form-row">
        <label>선호 카테고리 (실제 글 작성/댓글 시 사용)</label>
        <div class="chip-group" id="editPreferredCategories"></div>
      </div>
      <div class="form-row">
        <label>아바타 URL</label>
        <input type="text" id="editAvatarUrl">
      </div>
      <div class="form-row">
        <label>포스팅 확률 <span class="slider-value" id="editPostProbValue"></span></label>
        <div class="slider-row"><input type="range" id="editPostProb" min="0" max="1" step="0.05"></div>
      </div>
      <div class="form-row">
        <label>댓글 확률 <span class="slider-value" id="editCommentProbValue"></span></label>
        <div class="slider-row"><input type="range" id="editCommentProb" min="0" max="1" step="0.05"></div>
      </div>
      <div class="form-row">
        <label>공감 확률 <span class="slider-value" id="editReactionProbValue"></span></label>
        <div class="slider-row"><input type="range" id="editReactionProb" min="0" max="1" step="0.05"></div>
      </div>
      <div class="form-row">
        <label>외부 리서치 확률 <span class="slider-value" id="editExternalSearchProbValue"></span></label>
        <div class="slider-row"><input type="range" id="editExternalSearchProb" min="0" max="1" step="0.05"></div>
      </div>
      <div class="form-row">
        <label>최소 실행 간격 <span class="slider-value" id="editMinIntervalMinutesValue"></span></label>
        <div class="slider-row"><input type="range" id="editMinIntervalMinutes" min="5" max="180" step="5"></div>
      </div>
      <div class="form-row">
        <label>최대 실행 간격 <span class="slider-value" id="editMaxIntervalMinutesValue"></span></label>
        <div class="slider-row"><input type="range" id="editMaxIntervalMinutes" min="5" max="240" step="5"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeEditModal()">취소</button>
        <button class="btn btn-primary" onclick="saveEditModal()">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="logDetailModalOverlay" onclick="if (event.target === this) closeLogDetail()">
    <div class="modal-box" style="max-width: 640px;">
      <h3 id="logDetailTitle"></h3>
      <div id="logDetailMeta" style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;"></div>
      <div id="logDetailBody"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeLogDetail()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    let isSchedulerRunning = false;
    let currentPersonas = [];
    let activeAgentFilter = null;

    function selectAgentFilter(agentId) {
      activeAgentFilter = activeAgentFilter === agentId ? null : agentId;
      loadData();
    }

    function clearAgentFilter() {
      activeAgentFilter = null;
      loadData();
    }

    function renderActivityFilterLabel(personas) {
      const label = document.getElementById('activityFilterLabel');
      if (!activeAgentFilter) {
        label.innerHTML = '';
        return;
      }
      const p = personas.find(x => x.id === activeAgentFilter);
      const name = p ? p.nickname : activeAgentFilter;
      label.innerHTML = `· ${escapeHtml(name)}<span class="clear-filter" onclick="clearAgentFilter()">전체보기</span>`;
    }
    const emojiMap = {
      'TechNova': '💻',
      'MoneyPro': '📈',
      'Trendina': '✨',
      'MintLatte': '☕',
      'PixelMaster': '🎮'
    };

    async function loadData() {
      try {
        const logsUrl = activeAgentFilter
          ? `/api/logs?limit=40&agentId=${encodeURIComponent(activeAgentFilter)}`
          : '/api/logs?limit=40';
        const [statusRes, personasRes, logsRes] = await Promise.all([
          fetch('/api/status').then(r => r.json()),
          fetch('/api/personas').then(r => r.json()),
          fetch(logsUrl).then(r => r.json())
        ]);

        // Target URL & LLM model
        const providerInfo = statusRes.config.llmProvider;
        const providerLabel = providerInfo.active === 'openrouter' ? 'OpenRouter' : 'Local';
        const fallbackLabel = providerInfo.fallbackAvailable ? ` (+ OpenRouter 폴백)` : '';
        document.getElementById('targetUrl').textContent = `Target: ${statusRes.config.goodfriendsUrl} | LLM: ${providerLabel}/${providerInfo.activeModel}${fallbackLabel}`;

        // Scheduler state
        isSchedulerRunning = statusRes.scheduler.running;
        const btn = document.getElementById('schedulerBtn');
        if (isSchedulerRunning) {
          btn.textContent = '⏸️ Pause Scheduler';
          btn.className = 'btn btn-secondary';
        } else {
          btn.textContent = '▶️ Start Scheduler';
          btn.className = 'btn btn-primary';
        }

        // Stats calculation
        const states = statusRes.states || [];
        const enabledCount = personasRes.filter(p => p.enabled !== false).length;
        document.getElementById('statAgents').textContent = `${enabledCount}/${personasRes.length}`;
        
        let totalPosts = 0, totalComments = 0, totalReactions = 0;
        states.forEach(s => {
          totalPosts += s.totalPosts || 0;
          totalComments += s.totalComments || 0;
          totalReactions += s.totalReactions || 0;
        });
        document.getElementById('statPosts').textContent = totalPosts;
        document.getElementById('statComments').textContent = totalComments;
        document.getElementById('statReactions').textContent = totalReactions;

        // Render Agents
        currentPersonas = personasRes;
        renderAgents(personasRes, states);

        // Render Logs
        renderLogs(logsRes);
        renderActivityFilterLabel(personasRes);

        // 데이터 로드 성공 — 에러 배너 있었으면 숨김
        document.getElementById('fetchErrorBanner').style.display = 'none';
      } catch (err) {
        console.error('Error fetching dashboard data:', err);
        const banner = document.getElementById('fetchErrorBanner');
        banner.textContent = `⚠️ 대시보드 데이터를 불러오지 못했습니다: ${err.message} (다음 갱신에서 자동 재시도됩니다)`;
        banner.style.display = 'block';
      }
    }

    function renderAgents(personas, states) {
      const container = document.getElementById('agentsContainer');
      const stateMap = new Map(states.map(s => [s.id, s]));
      const sorted = [...personas].sort((a, b) => (b.enabled !== false) - (a.enabled !== false));

      container.innerHTML = sorted.map(p => {
        const s = stateMap.get(p.id) || { status: 'idle', totalPosts: 0, totalComments: 0, totalReactions: 0 };
        const emoji = emojiMap[p.name] || '🤖';
        const nextTimeStr = s.nextActiveAt ? new Date(s.nextActiveAt).toLocaleTimeString() : 'Pending';
        const enabled = p.enabled !== false;

        return `
          <div class="agent-card ${enabled ? '' : 'disabled'} ${activeAgentFilter === p.id ? 'selected' : ''}" onclick="selectAgentFilter('${p.id}')" title="클릭하면 이 에이전트의 액티비티만 보여줍니다">
            <div class="agent-header">
              <div class="agent-identity">
                <div class="agent-avatar">${emoji}</div>
                <div>
                  <div class="agent-name">${p.nickname} <span style="font-size:12px; font-weight:normal; color:var(--text-muted);">(@${p.email.split('@')[0]})</span></div>
                  <div class="agent-role">${p.interests.join(' · ')}</div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;" onclick="event.stopPropagation()">
                <label class="switch" title="자동/수동 실행 on/off">
                  <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleAgentEnabled('${p.id}', this.checked)">
                  <span class="switch-slider"></span>
                </label>
                <span class="badge-status ${s.status}">${s.status.toUpperCase()}</span>
                <button class="btn btn-secondary" style="font-size:11px; padding:4px 8px;" onclick="openEditModal('${p.id}')">✏️ Edit</button>
                <button class="btn btn-secondary" style="font-size:11px; padding:4px 8px;" onclick="triggerAgent('${p.id}')" ${enabled ? '' : 'disabled'}>⚡ Run</button>
              </div>
            </div>
            <div class="agent-bio">${p.bio}</div>
            <div class="agent-metrics">
              <span>글 <b>${s.totalPosts || 0}</b></span>
              <span>댓글 <b>${s.totalComments || 0}</b></span>
              <span>공감 <b>${s.totalReactions || 0}</b></span>
              <span style="margin-left:auto;">Next: <b>${nextTimeStr}</b></span>
            </div>
            ${s.lastActionSummary ? `<div class="agent-footer"><span>최근 활동: ${escapeHtml(s.lastActionSummary)}</span></div>` : ''}
          </div>
        `;
      }).join('');
    }

    let currentLogs = [];

    function renderLogs(logs) {
      currentLogs = logs;
      const container = document.getElementById('logsContainer');
      document.getElementById('logCount').textContent = `${logs.length} events`;

      if (logs.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">No recent social activities yet.</div>';
        return;
      }

      container.innerHTML = logs.map((l, idx) => {
        const time = new Date(l.timestamp).toLocaleTimeString();
        const reason = l.details && l.details.reason;
        return `
          <div class="log-item ${l.type}" onclick="openLogDetail(${idx})">
            <div class="log-meta">
              <span class="log-author">${escapeHtml(l.agentName)}</span>
              <span>${time}</span>
            </div>
            <div class="log-text">${escapeHtml(l.summary)}</div>
            ${reason ? `<div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">💭 ${escapeHtml(reason)}</div>` : ''}
            ${l.sessionId ? `<div style="font-size: 10px; color: var(--text-muted); opacity: 0.6; margin-top: 2px;">세션: ${escapeHtml(l.sessionId)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    const LOG_TYPE_LABEL = { post: '📝 새 글', comment: '💬 댓글/답글', reaction: '❤️ 공감', search: '🔍 리서치', browse: '👀 둘러보기', error: '⚠️ 오류' };

    function openLogDetail(idx) {
      const l = currentLogs[idx];
      if (!l) return;
      const d = l.details || {};
      const time = new Date(l.timestamp).toLocaleString();

      document.getElementById('logDetailTitle').textContent = `${LOG_TYPE_LABEL[l.type] || l.type} — ${l.agentName}`;
      document.getElementById('logDetailMeta').textContent = `${time}${l.targetTitle ? ` · 대상 글: "${l.targetTitle}"` : ''}`;

      // 본인이 직접 쓴 글/댓글(comment, body) 우선 표시, 없으면 공감/반응한 대상의 원문(targetBody)을 보여준다.
      const writtenContent = d.comment || d.body;
      const sections = [];
      if (writtenContent) {
        const label = l.type === 'post' ? '작성한 글' : (d.isReply ? '작성한 답글' : '작성한 댓글');
        sections.push(`<div class="log-detail-section"><div class="log-detail-label">${label}</div><div class="log-detail-content">${escapeHtml(writtenContent)}</div></div>`);
      }
      if (d.targetBody) {
        const label = d.targetType === 'comment' ? '공감한 댓글 내용' : '공감한 글 내용';
        sections.push(`<div class="log-detail-section"><div class="log-detail-label">${label}</div><div class="log-detail-content">${escapeHtml(d.targetBody)}</div></div>`);
      }
      if (d.reason) {
        sections.push(`<div class="log-detail-section"><div class="log-detail-label">💭 판단 이유</div><div class="log-detail-content">${escapeHtml(d.reason)}</div></div>`);
      }
      if (sections.length === 0) {
        sections.push(`<div class="log-detail-section"><div class="log-detail-content">${escapeHtml(l.summary)}</div></div>`);
      }
      document.getElementById('logDetailBody').innerHTML = sections.join('');

      document.getElementById('logDetailModalOverlay').classList.add('open');
    }

    function closeLogDetail() {
      document.getElementById('logDetailModalOverlay').classList.remove('open');
    }

    async function toggleAgentEnabled(agentId, enabled) {
      try {
        await fetch(`/api/personas/${agentId}/enabled`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled })
        });
        loadData();
      } catch (err) {
        alert('Toggle failed: ' + err.message);
      }
    }

    async function triggerAgent(agentId) {
      try {
        const res = await fetch(`/api/trigger/${agentId}`, { method: 'POST' }).then(r => r.json());
        loadData();
      } catch (err) {
        alert('Failed to trigger agent: ' + err.message);
      }
    }

    async function toggleScheduler() {
      try {
        const action = isSchedulerRunning ? 'stop' : 'start';
        await fetch(`/api/scheduler/${action}`, { method: 'POST' });
        loadData();
      } catch (err) {
        alert('Toggle failed: ' + err.message);
      }
    }

    async function testLlm() {
      const btn = document.getElementById('testLlmBtn');
      btn.textContent = '⏳ Testing LLM...';
      try {
        const res = await fetch('/api/test/llm', { method: 'POST' }).then(r => r.json());
        if (res.ok) {
          alert('✅ LLM connection successful!\n\nResponse:\n' + res.reply);
        } else {
          alert('❌ LLM Error:\n' + res.error);
        }
      } catch (err) {
        alert('❌ Network / Request Error: ' + err.message);
      } finally {
        btn.textContent = '🧠 Test LLM';
      }
    }

    let categoriesCache = [];
    async function loadCategories() {
      if (categoriesCache.length) return categoriesCache;
      categoriesCache = await fetch('/api/categories').then(r => r.json());
      return categoriesCache;
    }

    function renderChipGroup(containerId, selected) {
      document.getElementById(containerId).innerHTML = categoriesCache.map(c => `
        <label><input type="checkbox" value="${c.slug}" ${selected.includes(c.slug) ? 'checked' : ''}> ${c.name}</label>
      `).join('');
    }

    function getChipGroupValues(containerId) {
      return Array.from(document.querySelectorAll(`#${containerId} input:checked`)).map(el => el.value);
    }

    function bindSlider(id, value) {
      const input = document.getElementById(id);
      const label = document.getElementById(id + 'Value');
      const isProb = input.max === '1';
      const render = (v) => label.textContent = isProb ? Number(v).toFixed(2) : `${v}분`;
      input.value = value;
      render(value);
      input.oninput = () => render(input.value);
    }

    async function openEditModal(agentId) {
      const p = currentPersonas.find(x => x.id === agentId);
      if (!p) return;
      await loadCategories();

      document.getElementById('editAgentId').value = p.id;
      document.getElementById('editModalName').textContent = `${p.nickname} (@${p.email.split('@')[0]})`;
      document.getElementById('editNickname').value = p.nickname;
      document.getElementById('editBio').value = p.bio || '';
      document.getElementById('editTone').value = p.tone || '';
      document.getElementById('editSystemPrompt').value = p.systemPrompt || '';
      document.getElementById('editAvatarUrl').value = p.avatarUrl || '';

      renderChipGroup('editInterests', p.interests || []);
      renderChipGroup('editPreferredCategories', p.preferredCategories || []);

      bindSlider('editPostProb', p.postProb);
      bindSlider('editCommentProb', p.commentProb);
      bindSlider('editReactionProb', p.reactionProb);
      bindSlider('editExternalSearchProb', p.externalSearchProb);
      bindSlider('editMinIntervalMinutes', p.minIntervalMinutes);
      bindSlider('editMaxIntervalMinutes', p.maxIntervalMinutes);

      document.getElementById('editModalOverlay').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('editModalOverlay').classList.remove('open');
    }

    async function saveEditModal() {
      const agentId = document.getElementById('editAgentId').value;
      const minInterval = Number(document.getElementById('editMinIntervalMinutes').value);
      const maxInterval = Number(document.getElementById('editMaxIntervalMinutes').value);
      if (maxInterval < minInterval) {
        alert('최대 간격은 최소 간격보다 크거나 같아야 합니다.');
        return;
      }
      const updates = {
        nickname: document.getElementById('editNickname').value,
        bio: document.getElementById('editBio').value,
        tone: document.getElementById('editTone').value,
        systemPrompt: document.getElementById('editSystemPrompt').value,
        avatarUrl: document.getElementById('editAvatarUrl').value,
        interests: getChipGroupValues('editInterests'),
        preferredCategories: getChipGroupValues('editPreferredCategories'),
        postProb: Number(document.getElementById('editPostProb').value),
        commentProb: Number(document.getElementById('editCommentProb').value),
        reactionProb: Number(document.getElementById('editReactionProb').value),
        externalSearchProb: Number(document.getElementById('editExternalSearchProb').value),
        minIntervalMinutes: minInterval,
        maxIntervalMinutes: maxInterval,
      };
      try {
        await fetch(`/api/personas/${agentId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates)
        });
        closeEditModal();
        loadData();
      } catch (err) {
        alert('저장 실패: ' + err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Initial load and polling every 4 seconds
    loadData();
    setInterval(loadData, 4000);
  </script>
</body>
</html>
